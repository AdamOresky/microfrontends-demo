<html lang="sk">
<head>
	<title>MicroShop</title>
	<link rel="shortcut icon" href="">
	<link href="static/page.css" rel="stylesheet"/>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		  crossorigin="anonymous">
</head>
<body class="container">

<h1 class="header">
	<span class="header-left">
		<a class="logo-link" href="http://localhost:3002/home">MicroShop</a>
	</span>
	<span class="header-right">
		<a href="http://localhost:3002/home">Produkty</a>
		<a href="http://localhost:3003/cart">Košík</a>
	</span>
</h1>

<div id="product-container" class="row mt-5"></div>

<script>
	(function () {
		const urlParams = new URLSearchParams(window.location.search);
		const productId = urlParams.get('id');

		fetch('http://localhost:3030/products.json')
			.then(response => response.json())
			.then(data => {
				const product = data[productId];
				if (!product) {
					document.getElementById('product-container').innerHTML =
						`<p>Produkt nebol nájdený.</p>`;
					return;
				}

				document.title = product.name;

				document.getElementById('product-container').innerHTML = `
			  <div class="col-4 mt-4">
				<img class="img-fluid border p-3" alt="${product.name}" src="${product.imageUrl}" />
			  </div>
			  <div class="col-8 mt-4">
				<h2>${product.name}</h2>
				<p class="text-muted mb-3">${product.description || ''}</p>
				<p class="mb-0">Rok výroby: <span class="fw-bold">${product.year}</span></p>
				<p>
				  Skladom: <span class="text-success fw-bold">${product.stock} ks</span>
				</p>
				<h4 class="mb-4">Cena: ${product.price.toLocaleString('sk-SK')} €</h4>
				
				<div class="d-flex gap-2">
				  <a href="http://localhost:3003/cart?action=add&id=${productId}" class="btn btn-primary">
					Pridať do košíka
				  </a>
				  <a href="http://localhost:3002/recommendations?id=${productId}" class="btn btn-outline-secondary">
					Odporúčané
				  </a>
				</div>
			  </div>
			`;
			})
			.catch(err => {
				console.error("Nepodarilo sa načítať dáta produktu:", err);
				document.getElementById('product-container').innerHTML =
					`<p>Nepodarilo sa načítať dáta produktu.</p>`;
			});
	})();
</script>

<div class="footer d-flex flex-column align-items-center gap-2 pb-3">
	<label style="cursor: pointer; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;">
	  <input type="checkbox" id="show-teams-toggle" style="cursor: pointer;"> Zobraziť tímy
	</label>
	<span>MicroShop © 2026 | Bakalárska práca</span>
</div>
<script src="http://localhost:3030/teams.js"></script>
<script src="http://localhost:3030/team-frame.js"></script>
<script>
	window.TeamLabels.init([{ name: "Tím Produkt", color: "MediumSeaGreen" }]);
	window.initTeamFrame('MediumSeaGreen');
</script>
</body>
</html>
