<html lang="sk">
<head>
    <title>MicroShop</title>
    <link rel="shortcut icon" href="">
    <link href="static/page.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
</head>
<body class="container">
<h1 class="header">MicroShop</h1>

<div id="products" class="row mt-5"></div>

<script>
    fetch('http://localhost:3030/products.json')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('products');
            container.innerHTML = "";

            Object.entries(data).forEach(([id, product]) => {
                const col = document.createElement("div");
                col.className = "col-3 mb-4";

                col.innerHTML = `
              <div class="card h-100 shadow-sm">
                <img src="${product.imageUrl}" class="card-img-top" alt="${product.name}">
                <div class="card-body text-center">
                  <h5 class="card-title">${product.name}</h5>
                  <a href="product?id=${id}">Detail produktu</a>
                </div>
              </div>
            `;
                container.appendChild(col);
            });
        })
        .catch(err => {
            console.error("Nepodarilo sa načítať produkty:", err);
            document.getElementById('products').innerHTML =
                `<p>Nepodarilo sa načítať produkty.</p>`;
        });
</script>
</body>
</html>
