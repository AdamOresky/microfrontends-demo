<html lang="sk">

<head>
  <meta charset="utf-8">
  <link href="http://localhost:3001/static/page.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <title></title>
</head>

<body class="container">
  <div class="footer d-flex flex-column align-items-center gap-2 pb-3 mb-3 mb-0" style="margin-top:0;">
    <label
      style="cursor: pointer; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;">
      <input type="checkbox" id="show-teams-toggle" style="cursor: pointer;"> Zobraziť tímy
    </label>
    <span>MicroShop 2026 | Bakalárska práca</span>
  </div>
  <script src="http://localhost:3030/teams.js"></script>
  <script>
    (function () {
      const el = document.querySelector('.footer');
      if (!el) return;
      function apply(show) {
        el.style.outline = show ? '3px dashed DodgerBlue' : '';
        el.style.outlineOffset = show ? '4px' : '';
      }
      window.addEventListener('teamStateChanged', (e) => apply(e.detail.show));
      // Apply initial state in case teamStateChanged already fired before this ran
      const match = document.cookie.split('; ').find(row => row.startsWith('showTeams='));
      if (match && match.split('=')[1] === 'true') apply(true);
    })();
  </script>
</body>

</html>
