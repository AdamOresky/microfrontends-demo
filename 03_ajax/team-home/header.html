<html lang="sk">

<head>
	<meta charset="utf-8">
	<link href="http://localhost:3001/static/page.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		crossorigin="anonymous">
	<title></title>
</head>

<body class="container">
	<h1 class="header">
		<span class="header-left">
			<a class="logo-link" href="http://localhost:3002/home" target="_parent">MicroShop</a>
		</span>
		<span class="header-right">
			<a href="http://localhost:3002/home" target="_parent">Produkty</a>
			<a href="http://localhost:3003/cart" target="_parent">Košík</a>
		</span>
	</h1>
	<script src="http://localhost:3030/teams.js"></script>
	<script>
		(function () {
			const el = document.querySelector('.header');
			if (!el) return;
			function apply(show) {
				el.style.outline = show ? '3px dashed DodgerBlue' : '';
				el.style.outlineOffset = show ? '4px' : '';
			}
			window.addEventListener('teamStateChanged', (e) => apply(e.detail.show));
			// Apply initial state in case teamStateChanged already fired before this ran
			const match = document.cookie.split('; ').find(row => row.startsWith('showTeams='));
			if (match && match.split('=')[1] === 'true') apply(true);
		})();
	</script>
</body>

</html>
