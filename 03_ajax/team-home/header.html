  <script>
    window.addEventListener('teamStateChanged', (e) => {
      const body = document.body;
      if (e.detail.show) {
        body.style.outline = `3px dashed blue`;
        body.style.outlineOffset = '-3px';
      } else {
        body.style.outline = '';
      }
    });
  </script>
