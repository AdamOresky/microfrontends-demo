<html lang="sk">
<head>
    <title>MicroShop</title>
    <link rel="shortcut icon" href="">
    <link href="static/page.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
</head>
<body class="container">

<a href="http://localhost:3001/home" class="text-decoration-none">
    <h1 class="header">MicroShop</h1>
</a>

<div id="product-container" class="row mt-5"></div>

<script>
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        fetch('http://localhost:3030/products.json')
            .then(response => response.json())
            .then(data => {
                const product = data[productId];
                if (!product) {
                    document.getElementById('product-container').innerHTML =
                        `<p>Produkt nebol nájdený.</p>`;
                    return;
                }

                document.title = product.name;

                document.getElementById('product-container').innerHTML = `
            <h2>${product.name}</h2>
            <div class="col-4 mt-3">
                <img class="image img-fluid" alt="${product.name}" src="${product.imageUrl}" />
            </div>
            <div class="col-8 mt-3">
                <p>${product.description}</p>
                <p>Dostupných: ${product.stock} ks</p>
                <p>Cena: ${product.price} €</p>
            </div>

            <iframe class="mt-5"
                    src="http://localhost:3002/recommendations?id=${productId}">
            </iframe>
            `;
            })
            .catch(err => {
                console.error("Nepodarilo sa načítať dáta produktu:", err);
                document.getElementById('product-container').innerHTML =
                    `<p>Nepodarilo sa načítať dáta produktu.</p>`;
            });
    })();
</script>
</body>
</html>
