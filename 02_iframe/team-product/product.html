<html lang="sk">

<head>
  <title>MicroShop</title>
  <meta charset="utf-8">
  <link href="static/page.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <iframe src="http://localhost:3001/header" style="margin-top: 10px; width: 100%; height: 100px; border: none; overflow:hidden;"></iframe>

  <div class="container flex-grow-1">
    <div id="product-container" class="row mt-5 mb-5"></div>

    <hr class="mb-3" />

    <iframe id="recommendations-frame" src="" style="width:100%; height:450px; border:none; overflow:hidden;"></iframe>
  </div>

  <iframe src="http://localhost:3001/footer" style="width: 100%; height: 118px; margin-bottom: 10px; border: none; overflow:hidden;"></iframe>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      // Setup recommendations iframe url
      if (productId) {
        document.getElementById('recommendations-frame').src = `http://localhost:3002/recommendations?id=${productId}`;
      }

      fetch('http://localhost:3030/products.json')
        .then(response => response.json())
        .then(data => {
          const product = data[productId];
          if (!product) {
            document.getElementById('product-container').innerHTML = `<p>Produkt nebol nájdený.</p>`;
            return;
          }

          document.title = product.name;

          document.getElementById('product-container').innerHTML = `
              <div class="col-4 mt-4">
                <img class="img-fluid border p-3" alt="${product.name}" src="${product.imageUrl}" />
              </div>
              <div class="col-8 mt-4">
                <h2>${product.name}</h2>
                <p class="text-muted">${product.description || ''}</p>
                <p>
                  Skladom: <span class="${product.stock > 0 ? 'text-success' : 'text-danger'} fw-bold">${product.stock} ks</span>
                </p>
                <h4 class="mb-4">Cena: ${product.price.toLocaleString('sk-SK')} €</h4>
                
                <div class="d-flex gap-2">
                  <a href="http://localhost:3003/cart?action=add&id=${productId}" class="btn btn-primary ${product.stock > 0 ? '' : 'disabled'}">
                    Pridať do košíka
                  </a>
                </div>
              </div>
            `;
        })
        .catch(err => {
          console.error("Nepodarilo sa načítať dáta produktu:", err);
          document.getElementById('product-container').innerHTML = `<p>Nepodarilo sa načítať dáta produktu.</p>`;
        });

    })();
  </script>
  <script src="http://localhost:3030/teams.js"></script>
  <script src="http://localhost:3030/team-frame.js"></script>
  <script>
    window.TeamLabels.init([
      { name: "Tím Domov", color: "DodgerBlue" },
      { name: "Tím Produkt", color: "MediumSeaGreen" }
    ]);
    window.initTeamFrame('MediumSeaGreen');
  </script>
</body>
</html>
